services:
  # --- Database (PostgreSQL) ---
  db:
    image: postgres:15-alpine
    container_name: social_network_db
    restart: always
    environment:
      POSTGRES_USER: tzipora
      POSTGRES_PASSWORD: ninja
      POSTGRES_DB: realtime_social_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

  # --- Database Management (pgAdmin) ---
  pgadmin:
    image: dpage/pgadmin4
    container_name: social_network_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: tzp81134@gmail.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - db
    volumes:
      - pgadmin-data:/var/lib/pgadmin

  # --- Backend (Node.js API) ---
  server:
    build: ./server
    container_name: social_network_api
    restart: always
    environment:
      # התאמה מדויקת לקובץ db.ts ול-.env
      PORT: 5000
      NODE_ENV: development
      DB_USER: tzipora
      DB_PASSWORD: ninja
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: realtime_social_db
      JWT_SECRET: my_ultra_secure_social_network_secret_key_2026
      REFRESH_TOKEN_SECRET: another_very_secret_key_for_refresh_tokens_98765
    ports:
      - "5000:5000"
    depends_on:
      - db

  # --- Frontend (Vite / React) ---
  client:
    build: ./client
    container_name: social_network_frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000/api
    depends_on:
      - server

volumes:
  pgdata:
  pgadmin-data: